<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Laboratoire ChatCore + Outlook R2D3 : migration SMTP</title>
<style>
:root{font:16px/1.45 Arial,sans-serif;color-scheme:light dark;--bg:light-dark(#eef3f8,#111c29);--panel:light-dark(#fff,#203044);--line:light-dark(#c7d5e2,#53677e);--text:light-dark(#193a54,#eef5fb)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
header{padding:12px 17px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:clamp(18px,2.3vw,23px);margin:0;flex:1}
header a{color:inherit}
header button{border-radius:7px;border:1px solid var(--line);padding:7px 12px;cursor:pointer;background:var(--bg);color:inherit}
main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.85fr);gap:14px;padding:14px;align-items:start}
section{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px}
h2{font-size:19px;margin:0 0 9px}
small,.note{font-size:13px}
.note{margin:0 0 10px}
#outlook-host{min-height:630px}
#chat-host{min-height:320px}
#status{font-size:13px;margin:6px 0 0;line-height:1.5}
#status[role=alert]{color:#c75a33}
#outlook-host .ou-app{min-height:625px}
@media(max-width:980px){main{grid-template-columns:minmax(0,1fr)}#outlook-host{min-height:550px}}
</style>
<link rel="stylesheet" href="https://chaoli22000bzh.github.io/C2-Lab/shared-ui/v1/outlook.css">
<link rel="stylesheet" href="https://chaoli22000bzh.github.io/chatcore/v0.1/chatcore.css">
</head>
<body>
<header>
<h1>Laboratoire : ChatCore + Outlook R2D3</h1>
<a href="./">Retour au laboratoire</a>
<button type="button" id="reset">Recommencer</button>
</header>
<main>
<section aria-label="Outlook">
<h2>Outlook : poste du client</h2>
<p class="note">Vérifie la configuration du serveur sortant dans les paramètres du compte. Le client ne transmet pas les nouveaux paramètres avant cette vérification.</p>
<div id="outlook-host"></div>
</section>
<section aria-label="Conversation avec le client">
<h2>Échanger avec le client</h2>
<div id="chat-host"></div>
<p id="status" role="status" aria-live="polite">Initialisation des moteurs…</p>
</section>
</main>
<script type="module" src="./messagerie-outlook.js?v=20261115-1"></script>
</body>
</html>
