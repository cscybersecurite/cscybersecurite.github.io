<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Essai de remise des travaux</title>
<style>
:root{font-family:Arial,sans-serif;color-scheme:light dark;--accent:#1872b8}
*{box-sizing:border-box}
body{margin:0;background:light-dark(#f3f6f9,#101823);color:light-dark(#182535,#f1f5fa);line-height:1.5}
main{max-width:560px;margin:28px auto;padding:0 15px}
article{background:light-dark(#fff,#1c2939);border:1px solid light-dark(#d7e1eb,#354455);border-radius:15px;padding:24px}
h1{font-size:1.45rem;margin:0 0 8px}p{margin:8px 0 18px}
label{display:block;font-weight:bold;margin:16px 0 6px}
input{display:block;width:100%;font:inherit;padding:12px;border:1px solid #8997a8;border-radius:8px;background:light-dark(#fff,#101823);color:inherit}
input:disabled{opacity:.5;cursor:not-allowed}
small{display:block;margin-top:6px}
fieldset{border:0;padding:0;margin:0}
fieldset:disabled{opacity:.55}
button{margin-top:22px;padding:13px 18px;border:0;border-radius:8px;background:var(--accent);color:white;font:inherit;font-weight:bold;width:100%;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:.88rem;color:light-dark(#465a6f,#bdccdd)}
#status{min-height:2em;margin-top:16px;font-weight:bold}
</style>
</head>
<body>
<main><article>
<h1>Remettre mon travail</h1>
<p>Page de test indépendante. Aucun résultat réel de TP n'est envoyé.</p>
<form id="remise" autocomplete="off">
<label for="code">Code de session</label>
<input id="code" name="code" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="Code à 5 chiffres" required aria-describedby="code-hint">
<small id="code-hint" class="note">Saisis les 5 chiffres donnés par ton professeur.</small>
<fieldset id="identite" disabled>
<label for="nom">Nom</label>
<input id="nom" name="nom" autocomplete="family-name" required maxlength="80">
<label for="prenom">Prénom</label>
<input id="prenom" name="prenom" autocomplete="given-name" required maxlength="80">
</fieldset>
<button id="envoyer" type="submit" disabled>Envoyer mon travail</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<p class="note">Mode diagnostic : la réponse de Google Forms s'ouvrira après l'envoi pour vérifier si le code de session est accepté ou refusé.</p>
</article></main>
<script>
"use strict";
const GOOGLE_ACTION="https://docs.google.com/forms/d/e/1FAIpQLSdxdG9AYHWT2xyFW492g7OFWcTwvoohUGBYnwdy_Bp_Bc7nHw/formResponse";
const FIELDS={code:"entry.1517420395",prenom:"entry.1233827885",nom:"entry.1180081436",bilan:"entry.1939025670"};
const form=document.getElementById("remise");
const code=document.getElementById("code");
const identite=document.getElementById("identite");
const nom=document.getElementById("nom");
const prenom=document.getElementById("prenom");
const envoyer=document.getElementById("envoyer");
const status=document.getElementById("status");

function updateState(){
  const valid=/^[0-9]{5}$/.test(code.value);
  identite.disabled=!valid;
  envoyer.disabled=!valid || !nom.value.trim() || !prenom.value.trim();
  if(!valid){nom.value="";prenom.value="";}
  status.textContent="";
}
[code,nom,prenom].forEach(field=>field.addEventListener("input",updateState));
form.addEventListener("submit",event=>{
  event.preventDefault();
  updateState();
  if(envoyer.disabled || !form.reportValidity())return;
  const testPayload={
    schema:"remise-test-v1",
    tp:"depannage-reseau",
    simulation:true,
    statut:"TEST_FICTIF",
    progression:"9/9",
    date_test:new Date().toISOString(),
    controles:{continuite:"EXEMPLE",reseau:"EXEMPLE"}
  };
  const transmission=document.createElement("form");
  transmission.method="POST";
  transmission.action=GOOGLE_ACTION;
  transmission.target="_blank";
  transmission.style.display="none";
  transmission.acceptCharset="UTF-8";
  const data={
    [FIELDS.code]:code.value,
    [FIELDS.nom]:nom.value.trim(),
    [FIELDS.prenom]:prenom.value.trim(),
    [FIELDS.bilan]:JSON.stringify(testPayload)
  };
  for(const [key,value] of Object.entries(data)){
    const input=document.createElement("input");
    input.type="hidden";
    input.name=key;
    input.value=value;
    transmission.appendChild(input);
  }
  document.body.appendChild(transmission);
  transmission.submit();
  transmission.remove();
  envoyer.disabled=true;
  status.textContent="Envoi effectué vers Google Forms. Consulte la fenêtre Google pour connaître le résultat.";
});
</script>
</body>
</html>
