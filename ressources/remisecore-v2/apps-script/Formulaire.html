<!doctype html>
<html lang="fr"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;font-family:Arial,sans-serif}
body{margin:0;padding:16px;background:light-dark(#f2f6fb,#101923);color:light-dark(#152335,#f1f5f9)}
main{max-width:550px;margin:auto;background:light-dark(white,#203044);border-radius:14px;padding:22px;border:1px solid light-dark(#d1dce9,#3e526b)}
h1{font-size:1.5rem;margin-top:0}label{display:block;font-weight:bold;margin-top:18px}
input{width:100%;box-sizing:border-box;font:inherit;padding:12px;border:1px solid #8996a5;border-radius:7px;background:light-dark(white,#111e2c);color:inherit}
fieldset{border:0;margin:0;padding:0}fieldset:disabled{opacity:.55}
button{font:inherit;background:#176fba;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;margin-top:18px}
button:disabled{opacity:.4;cursor:not-allowed}
#retour{min-height:2.5em}small{display:block;margin-top:7px}
</style></head><body>
<main><h1>RemiseCore V2</h1>
<p>Prototype de remise : code de session vérifié sur le serveur.</p>
<label for="code">Code de session</label>
<input id="code" type="text" autocomplete="off">
<button type="button" id="verifier">Vérifier le code</button>
<fieldset id="identite" disabled>
<label for="nom">Nom</label><input id="nom" maxlength="80" autocomplete="family-name">
<label for="prenom">Prénom</label><input id="prenom" maxlength="80" autocomplete="given-name">
<button type="button" id="envoyer">Envoyer le test</button>
</fieldset>
<p id="retour" role="status" aria-live="polite"></p>
<small>Le résultat envoyé ici est fictif. Ne pas utiliser avec des élèves avant la recette et la validation du cadre de traitement.</small>
</main><script>
"use strict";
const $=id=>document.getElementById(id);
let codeValide="";
$("code").addEventListener("input",()=>{codeValide="";$("identite").disabled=true;$("retour").textContent="";});
$("verifier").addEventListener("click",()=>{
 const code=$("code").value;
 if(!code.trim()){$("retour").textContent="Saisis un code de session.";return;}
 $("verifier").disabled=true;$("retour").textContent="Vérification...";
 google.script.run.withSuccessHandler(r=>{
   $("verifier").disabled=false;
   if(r.autorise&&$("code").value===code){codeValide=code;$("identite").disabled=false;$("retour").textContent="Code accepté.";}
   else{$("retour").textContent="Code de session incorrect.";}
 }).withFailureHandler(()=>{$("verifier").disabled=false;$("retour").textContent="Vérification indisponible.";}).verifierCode(code);
});
$("envoyer").addEventListener("click",()=>{
 if(codeValide!==$("code").value)return;
 if(!$("nom").value.trim()||!$("prenom").value.trim()){$("retour").textContent="Renseigne le nom et le prénom.";return;}
 $("envoyer").disabled=true;$("retour").textContent="Envoi en cours...";
 google.script.run.withSuccessHandler(r=>{
   $("envoyer").disabled=false;
   $("retour").textContent=r.ok?"Test reçu. Référence : "+r.reference:r.message;
 }).withFailureHandler(()=>{$("envoyer").disabled=false;$("retour").textContent="Envoi impossible. Réessaie.";})
 .enregistrerRemise({
   code:codeValide,nom:$("nom").value,prenom:$("prenom").value,
   tp:"depannage-reseau",
   resultats:{schema:"remisecore-v2-test",simulation:true,progression:"9/9",reseau:{dhcp:"TEST",pingIP:"TEST",pingDNS:"TEST"}}
 });
});
</script></body></html>
