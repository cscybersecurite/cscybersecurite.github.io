  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #1e293b;
    }

    header { position: relative; background: #001006; }
    header h1 {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(calc(-22% + 10px));
      margin: 0;
      padding: 0 10px;
      color: #258b44;
      font-size: clamp(18.9px, 4.59vw, 68.4px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -.035em;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 20, 5, .8), 0 0 2px rgba(84, 225, 107, .3);
    }
    header img {
      display: block;
      width: 100%;
      height: clamp(120px, 9.5vw, 195px);
      object-fit: fill;
    }
    @media (max-width: 850px) {
      header img { height: auto; }
    }

    main {
      max-width: 1000px;
      margin: 45px auto;
      padding: 0 20px;
    }

    h2 { font-size: 1.4rem; }

    .ressource {
      display: block;
      max-width: 450px;
      margin-top: 25px;
      padding: 25px;
      background: white;
      border: 1px solid #dbe2ea;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .ressource:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.10);
    }

    .ressource h3 {
      margin: 0 0 12px;
      color: #17365d;
    }

    .ressource p {
      margin: 0 0 20px;
      line-height: 1.5;
    }

    .acces {
      color: #1558a6;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-size: 0.85rem;
    }
  
    /* Plan B : cartes avec illustration panoramique, responsive */
    main { max-width: 1240px; margin: 24px auto; padding: 0 16px; }
    .ressources { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 16px; align-items: stretch; }
    .ressource { display:flex; flex-direction:column; min-width:0; min-height:0; margin:0; padding:0; overflow:hidden; border:1px solid #dbe4f0; border-radius:14px; background:#fff; color:#12274b; text-decoration:none; box-shadow:0 5px 16px rgba(20,41,78,.08); transition:transform .2s,box-shadow .2s; }
    .ressource:hover,.ressource:focus-visible { transform:translateY(-3px); box-shadow:0 10px 24px rgba(20,41,78,.15); }
    .ressource:focus-visible { outline:3px solid #2563eb; outline-offset:3px; }
    .ressource:active { transform:scale(.99); }
    .ressource .contenu { display:flex; flex-direction:column; align-items:flex-start; gap:5px; min-width:0; padding:12px 15px 11px; }
    .ressource .etiquette { margin:0 0 2px; padding:4px 8px; border-radius:5px; background:#dbeafe; color:#165bd1; font-size:10px; font-weight:800; letter-spacing:.04em; }
    .ressource h3 { margin:0; font-size:20px; line-height:1.2; color:#102751; }
    .ressource p { margin:0; font-size:14px; line-height:1.4; }
    .ressource .visuel { display:flex; align-items:center; justify-content:center; width:100%; height:130px; padding:10px 15px; min-width:0; overflow:hidden; }
    .ressource svg { display:block; height:100%; width:100%; max-width:360px; filter:drop-shadow(0 2px 4px rgba(15,35,70,.12)); }
    .ressource.ipv4 .visuel { background:linear-gradient(130deg,#e8f4ff,#9ed2fa); }
    .ressource.flsm .visuel { background:linear-gradient(135deg,#f0eaff,#7c5be1); }
    .ressource.ipcalc .visuel { background:linear-gradient(135deg,#d9f8f2,#009b90); }
    .ressource.flsm .etiquette { background:#e8dcff; color:#6538b7; }
    .ressource.ipcalc .etiquette { background:#ccf5eb; color:#007e72; }
    @media (max-width:1199px) { main { max-width:830px; } .ressources { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:719px) { main { max-width:480px; margin:16px auto; padding:0 12px; } .ressources { grid-template-columns:1fr; gap:12px; } .ressource .contenu { padding:11px 14px 10px; } .ressource h3 { font-size:19px; } .ressource .visuel { height:112px; padding:8px 12px; } }
    @media (max-width:360px) { .ressource .visuel { height:100px; } }
    @media(prefers-reduced-motion:reduce){.ressource{transition:none}}
